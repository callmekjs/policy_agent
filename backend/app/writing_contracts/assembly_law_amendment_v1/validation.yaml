# 검사 규칙 (README §2.15.5, §2.15.7 D).
# Fact 원장이 준비된 뒤 후보 초안·수정안·내보내기 결과를 검사한다.
# 입력·자료·지원 범위 문제는 이 파일이 아니라 Harness의 Issue Gate가 맡는다.
validation_id: assembly_member_partial_amendment_plenary_validation
version: 1.0.0
owns_rules: [PRG-H-003, PRG-H-004, PRG-H-005, PRG-C-003, LEG-H-001, LEG-H-002, LEG-H-003, LEG-H-004, LEG-H-005]

# 하나라도 걸리면 안전하지 않은 후보를 보여주지 않는다.
blocking_checks:
  - {id: OUTPUT_STRUCTURE,    rule_ref: [PRG-H-001, PRG-H-002, TPL-H-001], reason: DRAFT·필수 구조·발표 주체 연결 누락, 부제 생성, 핵심 요약 개수 오류}
  - {id: CLAIM_FACT_LINK,     rule_ref: [PRG-H-003], reason: claim에 유효한 fact_id가 없거나 문장이 Fact와 다름, STYLE_ONLY 사실 유입}
  - {id: PROVENANCE,          rule_ref: [PRG-H-003], reason: 인용·법률 핵심·고위험 주장에 OFFICIAL_SOURCE가 없음}
  - {id: STAGE_EXPRESSION,    rule_ref: [LEG-H-001], reason: 확인된 단계·효력을 넘어 공포·시행·확정으로 확대 표현}
  - {id: ORIGINAL_VS_SUBSTITUTE, rule_ref: [LEG-H-002], reason: 대안반영폐기 원안을 통과안으로 표시}
  - {id: PROVISION_COMPARISON, rule_ref: [LEG-H-003], reason: 같은 법률·같은 조문의 전후 원문 없이 비교}
  - {id: DATE_NUMBER_QUOTE,   rule_ref: [PRG-H-003, PRG-C-003], reason: 값·요일·단위·인용 원문·화자·직책 불일치}
  - {id: SUPPLEMENTARY_PRESERVED, rule_ref: [LEG-H-004], reason: 시행 시점·적용례·경과조치·특례 누락·병합·임의 계산}
  - {id: PROTECTED_FACT,      rule_ref: [PRG-H-004], reason: 확인된 중요한 제한·주의·위험 Fact 누락}
  - {id: LEGAL_EFFECT,        rule_ref: [LEG-H-005], reason: 개인 적용·위법·권리·의무·처벌·소급 여부 단정}
  - {id: FORBIDDEN_PHRASE,    rule_ref: [PRG-H-005], reason: 금지 표현 사용}
  - {id: OPTIONAL_PLACEHOLDER, rule_ref: [TPL-C-001, TPL-C-002], reason: 근거 없는 인용·붙임·다음 절차를 자리표시자로 채움}

# 초안과 함께 보여주는 경고. 차단하지 않는다.
warning_checks:
  - {id: TITLE_LENGTH,     rule_ref: [PRG-S-001]}
  - {id: SENTENCE_LENGTH,  rule_ref: [PRG-S-003]}
  - {id: LEAD_SENTENCES,   rule_ref: [PRG-S-002]}
  - {id: BODY_PARAGRAPHS,  rule_ref: [TPL-S-001]}
  - {id: REPEATED_PHRASE,  rule_ref: [PRG-S-006]}
  - {id: HARD_WORDING,     rule_ref: [PRG-S-004]}
  - {id: SELF_PRAISE,      rule_ref: [PRG-S-006]}
  - {id: INVERTED_PYRAMID, rule_ref: [PRG-S-005]}

# PRG-H-005가 한 번만 정의하는 금지 표현.
forbidden_phrases:
  always:
    - 최종본
    - 승인본
    - 배포본
  without_official_basis:
    - 최초
    - 최대
    - 유일
    - 최고
    - 세계적
  narrative_only:      # 원문 인용 안에 실제로 있으면 화자에게 귀속해 표시 가능
    - 혁명적
    - 획기적
    - 완벽
    - 압도적
  fabricated_attribution:
    - 관계자

# 고위험 주장은 OFFICIAL_SOURCE만 근거로 쓸 수 있다.
official_source_required_for:
  - 인용문
  - 의안번호
  - 법률안명
  - 처리 결과
  - 조문
  - 법률번호
  - 공포일
  - 시행일
  - 적용례
  - 경과조치
  - 특례
  - 최초·최대·유일·최고 주장

# 발표 주체·보도 예정일·문의처만 사용자 확인값을 허용한다.
user_confirmed_allowed_for:
  - ANNOUNCEMENT_SUBJECT
  - PLANNED_RELEASE_DATE
  - CONTACT

# 보호 사실은 수정 요청으로도 바꾸거나 뺄 수 없다.
protected_fact_kinds:
  - SUPPLEMENTARY_RULE
  - IMPORTANT_LIMITATION
  - ANNOUNCEMENT_SUBJECT

# EXCLUDE 규칙은 검사기로 실행하지 않으므로 Finding을 만들 수 없다.
never_execute_rules: [PRG-X-001, PRG-X-002, PRG-X-003, PRG-X-004]
