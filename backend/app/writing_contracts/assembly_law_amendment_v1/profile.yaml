# 기관 프로필 (README §2.15.7 A).
# 국회의원실 공통 표기와 공식 입법 용어만 담는다.
# 특정 의원·정당·지역구·연락처와 매번 달라지는 의안 사실은 넣지 않는다.
profile_id: assembly_member_office_common_profile
version: 1.0.0

institution: 대한민국 국회
announcer_type: 국회의원실 공통형

# 프로필에 고정하지 않는 값. 현재 공식 자료의 Fact를 우선한다.
never_fixed:
  - 특정 의원 이름
  - 정당
  - 지역구
  - 의원실 이름
  - 실제 연락처
  - 현재 의안번호·날짜·조문·표결 결과

announcement_subject_source_order:
  - OFFICIAL_SOURCE
  - USER_CONFIRMED
  - APPROVED_PROFILE

date_format:
  body: "YYYY년 M월 D일"
  contract: "YYYY-MM-DD"
  note: "`경`·예정·기준일 같은 의미를 그대로 보존한다."

number_format:
  preserve: [값, 단위, 기간, 대상 범위]
  distinguish: ["%/%p", "원/만 원"]

contact:
  allowed_sources: [OFFICIAL_SOURCE, USER_CONFIRMED, APPROVED_PROFILE]
  placeholder: "[문의처 확인 필요]"
  note: "출력 위치는 template이 정한다."

# 이 표의 입법 용어 대응 관계만 profile의 정의다.
# 금지 표현은 validation이, 필수 문구 위치는 template이 한 번만 정의한다.
legislative_terms:
  - condition: 의원이 법률안을 냄
    expression: 발의
    alternate: 대표발의
  - condition: 본회의 원안가결
    expression: 본회의에서 원안가결됐다
  - condition: 본회의 수정가결
    expression: 본회의에서 수정가결됐다
  - condition: 위원회 대안을 본회의에서 원안가결
    expression: 위원회 대안이 본회의에서 원안가결됐다
  - condition: 본회의 의결 뒤 공포 전
    expression: 가결된 법률안
    effect_status_label: 아직 법률 아님
  - condition: 공식 다음 절차 Fact 없음
    expression: null
    note: 해당 문단을 생략한다

output_structure_owner: template
