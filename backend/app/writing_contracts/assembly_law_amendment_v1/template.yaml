# 유형 양식 (README §2.7, §2.15.7 B).
# 출력 순서와 필수·선택 항목만 정의한다. 금지 표현과 검사 방법은 validation이 맡는다.
template_id: assembly_member_partial_amendment_plenary_template
version: 1.0.0
owns_rules: [PRG-H-001, PRG-H-002, TPL-H-001, TPL-C-001, TPL-C-002]

# §2.7의 12개 항목을 그대로 사용한다.
sections:
  - {order: 1,  kind: DRAFT_MARK,           required: true,  fixed_text: "DRAFT / 내부 검토용"}
  - {order: 2,  kind: BASIS_AND_STATUS,     required: true}
  - {order: 3,  kind: ANNOUNCER_AND_RELEASE, required: true}
  - {order: 4,  kind: TITLE,                required: true}
  - {order: 5,  kind: KEY_POINTS,           required: true,  min_items: 2, max_items: 3}
  - {order: 6,  kind: LEAD,                 required: true,  paragraphs: 1}
  - {order: 7,  kind: BODY,                 required: true}
  - {order: 8,  kind: SUPPLEMENTARY,        required: conditional}
  - {order: 9,  kind: NEXT_PROCEDURE,       required: false}
  - {order: 10, kind: QUOTE,                required: false}
  - {order: 11, kind: CONTACT,              required: true}
  - {order: 12, kind: ATTACHMENT,           required: false}

required_sections:
  - DRAFT_MARK
  - BASIS_AND_STATUS
  - ANNOUNCER_AND_RELEASE
  - TITLE
  - KEY_POINTS
  - LEAD
  - BODY
  - CONTACT

# 근거가 없으면 자리 채우기 문장을 만들지 않고 생략한다.
conditional_sections: [SUPPLEMENTARY, NEXT_PROCEDURE, QUOTE, ATTACHMENT]

# 1차 출력 구조에 만들지 않는 것.
forbidden_sections: [SUBTITLE, INSTITUTION_INTRO, PHOTO]

required_marks:
  - "DRAFT / 내부 검토용"
  - "제공된 공식 자료 기준: {basis_date}"
  - "절차 단계: 본회의 의결"
  - "효력 상태: 아직 법률 아님"
  - "※ 시스템이 인터넷에서 최신 상태를 별도로 확인한 것은 아닙니다."

placeholders:
  release_date: "[보도일 확인 필요]"
  contact: "[문의처 확인 필요]"

body_order:
  - 의결 결과
  - 기존 문제·개정 목적
  - 바뀌는 내용
  - 근거 있는 기대효과

# 문단 구조. 사실 연결의 유효성 검사는 validation의 PRG-H-003이 맡는다.
paragraph_fields: [section_kind, priority_rank, claim_ids, fact_ids]
supplementary_paragraph_extra: [supplementary_rule_ids]
next_procedure_paragraph_extra: [next_procedure_fact_ids]

# resolved_final_text의 시행·적용 정보는 규칙마다 별도 출력 자리를 둔다.
supplementary_rule_slots: per_rule
