# 문체 기준 (README §2.15.3, §2.15.7 C).
# 여기 있는 값은 전부 경고 기준이며 초안을 차단하지 않는다.
style_id: assembly_press_public_language_style
version: 1.0.0
owns_rules: [PRG-S-001, PRG-S-002, PRG-S-003, PRG-S-004, PRG-S-005, PRG-S-006, TPL-S-001]

language: ko
sentence_ending: "-다"
tone: 쉬운 공공언어

# 길이 기준. 넘으면 경고만 하고 자동으로 잘라내지 않는다.
warning_thresholds:
  title_chars: 20          # PRG-S-001
  sentence_chars: 60       # PRG-S-003
  lead_sentences: 3        # PRG-S-002
  body_paragraphs_max: 8   # TPL-S-001

# 필수 내용이 다 있으면 1~5문단도 허용하고 안내만 표시한다.
body_paragraphs_reference: [6, 8]
body_paragraphs_min_notice: 5
paragraph_count_excludes:
  - 제목
  - 상태 표시
  - 핵심 요약
  - 리드
  - 문의처
  - 붙임

principles:
  - 중요한 내용을 앞에 두는 역피라미드로 쓴다
  - 한 문장에는 가능한 한 사실 주장 하나만 담는다
  - 어려운 공식 용어는 처음 나올 때 쉬운 설명을 붙인다
  - 문단 수를 맞추려고 같은 말을 반복하지 않는다

# 경고 대상 표현 습관.
warn_on:
  - 제목·핵심 요약·리드가 같은 문장을 반복
  - 자기 칭찬
  - 기관장 개인 중심
  - 선정적 표현
  - 핵심 없는 나열
  - 같은 연결어미 반복
  - 어려운 문어체·한자어·전문용어

priority: [정확성, 명확성, 매력]

# 사례는 구조·표현만 참고한다. 전문·이름·날짜·수치·인용·연락처는
# Agent Context에 넣지 않는다.
style_reference_ids: [NA-STYLE-001, NA-STYLE-002, NA-STYLE-003]
style_reference_use_scope: STYLE_ONLY
