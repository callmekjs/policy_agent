[project]
name = "policy-agent-backend"
version = "0.1.0"
description = "국정감사·자료분석형 보도자료 초안 작성 도구 — 명령줄"
requires-python = ">=3.12"
# 웹 서버(fastapi·uvicorn·python-multipart)와 yaml은 본회의형과 함께 지웠다.
# 남은 것은 이 둘뿐이다. 쓰지 않는 것을 적어 두면 설치가 무거워지고,
# 무엇이 진짜 필요한지 아무도 모르게 된다.
dependencies = [
    "pydantic>=2.9",  # 계약·원장 모양
    "openai>=2.21",  # infrastructure/openai_gateway.py — 진짜 AI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
