[project]
name = "policy-agent-backend"
version = "0.1.0"
description = "국회 법률 개정·개선 보도자료 초안 작성 Agent — FastAPI 백엔드"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    # 함수 안에서 늦게 import 하지만 **제품 기능이 실제로 쓴다.**
    # 빠져 있으면 진짜 AI는 켜는 순간 죽는다.
    "openai>=2.21",  # infrastructure/openai_gateway.py — 진짜 AI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
asyncio_mode = "auto"
